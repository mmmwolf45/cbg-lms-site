included:
  heading: One course, live projects and career support
  intro: Everything below is part of your course, from your first class to your job search.
  cards:
    - title: Live projects from the Middle East.
      body: Real project work from CBG's engineering services division, including a full civil and fit-out BOQ.
      featured: true
    - title: 11 practical assignments.
      body: From AutoCAD takeoffs to BOQs, BBS, rate analysis, estimates, RA bills, variations, cash flow and scheduling, each reviewed by CBG faculty, plus two CV submissions.
    - title: Software skills.
      body: Excel, AutoCAD, PlanSwift and Primavera P6.
    - title: Industry interaction.
      body: A session with experienced quantity surveyors on how the industry works day to day.
    - title: Personal mentorship.
      body: A mentor to guide you and take up anything you need with CBG.
