      body: Two CV sessions, line-by-line CV reviews until your CV is final, CBG's AI CV builder (cvbuilder.carbonblueglobal.com), HR interview preparation and mock interviews.
    - title: Placement assistance.
      body: Relevant job openings and interview support for eligible learners. CBG has supported 500+ placements across Saudi Arabia, the UAE, India, the Maldives and Africa.

units:
  heading: "Your learning path: 8 modules, 39 sessions"
  intro: After the Start Here orientation, the 8 modules run in the order you meet the work on a real project, starting with the basics and building step by step, with assignments along the way.
  # The building drawing labels each floor "<n> sessions".
  hoursLabel: sessions
  hoursShort: sessions
  units:
    - code: M01
      title: QS Foundations
      glh: 5
      outcomes:
        - Understand the QS role, the main construction components and the project workflow
        - Use Excel and AutoCAD for QS tasks
      sessions:
        - { id: "1.1", title: Introduction to QS }
        - { id: "1.2", title: Basics of Civil Engineering }
        - { id: "1.3", title: Construction Workflow }
        - { id: "1.4", title: Excel for QS }
        - { id: "1.5", title: AutoCAD for QS }
    - code: M02
      title: Measurement and BOQ
      glh: 11
      outcomes:
        - Measure works to POMI
        - Take off quantities manually and in PlanSwift
        - Prepare complete BOQs and bar bending schedules
      sessions:
        - { id: "2.1", title: POMI Part 1 }
        - { id: "2.2", title: POMI Part 2 }
        - { id: "2.3", title: BOQ Preparation Part 1 }
        - { id: "2.4", title: BOQ Preparation Part 2 }
        - { id: "2.5", title: "BOQ Preparation Part 3: Specifications" }
        - { id: "2.6", title: BOQ Preparation Part 4 }
        - { id: "2.7", title: PlanSwift Part 1 }
        - { id: "2.8", title: PlanSwift Part 2 }
        - { id: "2.9", title: Interior Fit-Out BOQ }
        - { id: "2.10", title: Roadworks BOQ }
        - { id: "2.11", title: Bar Bending Schedule (BBS) }
    - code: M03
      title: Estimating and Cost Planning
      glh: 3
      outcomes:
        - Build unit rates from first principles
        - Prepare estimates and detailed budgets
        - Apply value engineering
      sessions:
        - { id: "3.1", title: Rate Analysis }
        - { id: "3.2", title: Estimates }
        - { id: "3.3", title: Value Engineering }
    - code: M04
      title: Tendering and Contracts
      glh: 4
      outcomes:
        - Explain the tender process
        - Compare contract types and FIDIC forms
        - Use contract conditions, work orders and purchase orders
      sessions:
        - { id: "4.1", title: Tendering }
        - { id: "4.2", title: Contracts and FIDIC }
        - { id: "4.3", title: GCC and SCC }
        - { id: "4.4", title: Work Orders and Purchase Orders }
    - code: M05
      title: Post-Contract Billing
      glh: 4
      outcomes:
        - Prepare RA bills, final bills and certificates of payment
        - Value and log variations
        - Adjust provisional sums and prime cost items
      sessions:
        - { id: "5.1", title: RA Bill Preparation }
        - { id: "5.2", title: Final Bill and COP }
        - { id: "5.3", title: Variations and Extra Items }
        - { id: "5.4", title: Provisional Sums and Prime Cost }
    - code: M06
      title: Cost Control and Planning
      glh: 7
      outcomes:
        - Forecast cash flow and prepare cost reports
        - Schedule projects in Primavera P6
        - Manage manpower, materials and machinery
      sessions:
        - { id: "6.1", title: Cash Flow }
        - { id: "6.2", title: Cost Reports }
        - { id: "6.3", title: Project Scheduling }
        - { id: "6.4", title: Primavera P6 Part 1 }
        - { id: "6.5", title: Primavera P6 Part 2 }
        - { id: "6.6", title: Primavera P6 Part 3 }
        - { id: "6.7", title: 3M Management }
    - code: M07
      title: Closeout and Live Project
      glh: 3
      outcomes:
        - Close out and hand over a project
        - Apply the full QS workflow to a real Middle East live project
      sessions:
        - { id: "7.1", title: Project Closeout and Handover }
        - { id: "7.2", title: Middle East Live Project }
        - { id: "7.3", title: Industry Interaction }
    - code: M08
      title: Career Launch
      glh: 2
      outcomes:
        - Prepare a high-impact QS CV and LinkedIn profile
        - Get ready for HR and technical interviews
        - Use CBG's placement assistance
      sessions:
        - { id: "8.1", title: "CV Session 1: CV and LinkedIn" }
        - { id: "8.2", title: Interviews and Placement }

# Rebar X-ray: the bar bending schedule topic (Module 2, session 2.11). `at` is each label's point
# [x, y] in source pixels of the 1536 x 1024 photos, picked against the Higgsfield pair (4 Oct 2026).
xray:
  heading: See the steel. Measure every bar.
  intro: Concrete hides its reinforcement, but a quantity surveyor still has to count and measure every bar in it. In Module 2 you learn to read the structural drawing and prepare a bar bending schedule (BBS), from bar shapes and lap and development length to bend deduction and cutting length.
  image: qs-xray-concrete
  xray: qs-xray-steel
  imageAlt: A reinforced concrete column and footing; where the scan passes, the steel bars inside the concrete show through
  labels:
    - { text: Main bars, at: [667, 354] }
    - { text: Stirrups, at: [798, 491] }
    - { text: Lap length, at: [818, 727] }
    - { text: Development length, at: [666, 817] }
    - { text: Cutting length, at: [866, 869] }
  caption: "Assignment A04: a BBS for a footing and a column from a structural drawing."

how-classes-run:
  heading: How your classes run
  items:
    - title: 8 months, live online.
      body: 55 hours of technical sessions plus 3 hours of HR and CV sessions, taught live by CBG faculty so you can ask questions as you go.
    - title: Classes on alternate days.
      body: Your batch timetable is shared when you join.
    - title: Recorded sessions.
      body: Revisit topics at your own pace.
    - title: Help between classes.
      body: A WhatsApp doubt-clearance line for each topic, and one-to-one sessions with faculty on request. Your mentor can take any unresolved issue to CBG for you.
    - title: What you need.
      body: A laptop or PC with a stable internet connection. You will use Excel, AutoCAD, PlanSwift and Primavera P6, so make sure you can run them before the topics that use them.
  timetable:
    label: Batch days
    text: Monday, Wednesday and Friday, or Tuesday, Thursday and Saturday.

assessment:
  heading: How your work is assessed
  intro: You learn by doing. Each assignment and CV submission has its own deadline, and CBG faculty review your work and return feedback within 15 working days.
  assessments:
    - label: A01 to A11
      title: 11 practical assignments
      points:
        - From AutoCAD takeoffs to BOQs, BBS, rate analysis, estimates, RA bills, variations, cash flow and scheduling
        - Due 3 to 21 days after the class, in the format the brief asks for
        - XLSX for BOQs and billing, DWG plus PDF for AutoCAD, XER plus PDF for Primavera
    - label: CV1 and CV2
      title: 2 CV submissions
      points:
        - CV1 within 7 days of CV Session 1, CV2 within 7 days of CV Session 2 (PDF or DOCX)
        - CBG reviews your CV line by line
        - The review and revision loop continues until your CV is final

