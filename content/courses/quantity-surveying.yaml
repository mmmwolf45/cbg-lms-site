faq:
  heading: Student FAQ
  items:
    - q: Who is this course for?
      a: Civil engineering graduates, freshers and working professionals, such as site engineers, who want a career in quantity surveying, estimation, billing or cost control. You need a background in civil engineering, good numeracy and basic computer skills.
    - q: What does a quantity surveyor do?
      a: A quantity surveyor manages the cost and contract side of a construction project. That means measuring quantities, preparing BOQs and estimates, pricing work, preparing bills and payment certificates, valuing variations and keeping the project within budget, working closely with architects, engineers and contractors.
    - q: Can a civil engineer become a quantity surveyor?
      a: Yes. Civil engineers already understand construction, materials and site execution, which makes the move into quantity surveying a natural one. This course adds the measurement, commercial and contract skills on top.
    - q: How long is the course and when are classes held?
      a: "The course runs for 8 months: 55 hours of technical sessions plus 3 hours of HR and CV sessions. Classes are on alternate days, in Monday, Wednesday and Friday or Tuesday, Thursday and Saturday batches. Your batch timetable is shared when you join."
    - q: How is the course structured?
      a: "After a Start Here orientation, the course runs through 8 modules in the order you meet the work on a real project: QS Foundations; Measurement and BOQ; Estimating and Cost Planning; Tendering and Contracts; Post-Contract Billing; Cost Control and Planning; Closeout and Live Project; and Career Launch. It starts with the basics, including Excel and AutoCAD, and builds step by step, with assignments along the way so you learn by doing."
    - q: Are the classes live or recorded?
      a: "Classes are taught live online by CBG faculty, so you can ask questions as you go. Recorded sessions let you revisit topics."
    - q: What software do I need?
      a: A laptop or PC with a stable internet connection. You will use Excel, AutoCAD, PlanSwift and Primavera P6 during the course, so make sure you can run them before the topics that use them. Message CBG if you need help getting set up.
    - q: How are assignments submitted and evaluated?
      a: There are 11 assignments plus 2 CV submissions, each with its own deadline (3 to 21 days after the class). Submit them in the format the brief asks for, for example XLSX for BOQs and billing, DWG plus PDF for AutoCAD and XER plus PDF for Primavera. CBG faculty review your work and return feedback within 15 working days.
    - q: What certificates will I receive?
      a: "Three CBG certificates: a Course Completion Certificate and two Live Project Certificates."
    - q: What are the live projects?
      a: Real project work from CBG's engineering services division in the Middle East. You prepare civil and fit-out BOQs from live project drawings, guided by CBG faculty, and earn two Live Project Certificates.
    - q: Do you offer placement assistance?
      a: "Yes. Learners who complete the course, keep at least 75% live attendance, finish their assignments and pass the mock interviews receive relevant job openings and interview support. CBG has supported 500+ placements across Saudi Arabia, the UAE, India, the Maldives and Africa. Placement assistance is not a job guarantee: results depend on your effort, interviews and the market."
    - q: How does the CV review work?
      a: CV session 1 shows you how to build a high-impact CV and gives you access to CBG's AI CV builder (cvbuilder.carbonblueglobal.com). You submit your first CV within 7 days, attend CV session 2, then submit a revised CV within 7 days. CBG reviews it line by line, and the review and revision loop continues until your CV is final.
    - q: What if I get stuck between classes?
      a: Each topic has a WhatsApp doubt-clearance line, and you can request a one-to-one session with faculty. Your mentor can take any unresolved issue to CBG for you.
    - q: How do I enrol?
      a: Enrolment is by invitation. Message CBG on WhatsApp at +974 7048 5638 and our team will guide you through the next steps.

