faq:
  heading: Student FAQ
  items:
    - q: Where do I find the link for my live class?
      a: In the unit sections of this course, each session has a "Live Class" lesson with the Google Meet link, just before that session's study notes.
    - q: What do I need for the classes?
      a: A laptop or PC with a webcam and a stable internet connection. Join a few minutes early.
    - q: I missed a class. What should I do?
      a: Open that session's study notes on this page, read the workbook pages listed and try the Check yourself questions, then message your trainer or CBG with any questions.
    - q: How much self-study is expected?
      a: Besides the live classes and guided study (80 guided hours), IOSH expects about 42 hours of your own study across the course.
    - q: When do I take the IOSH assessments?
      a: When your trainers confirm you are ready, CBG registers you and tells you the date and time.
    - q: What happens if I'm referred in an assessment?
      a: You only retake the assessment you were referred in. IOSH charges a fee for a retake. Talk to us and we'll help you prepare.
    - q: What are the rules for the online assessments?
      a: >-
        They're remotely invigilated: one screen, a quiet room, photo ID, no phones or notes. The full IOSH rules are in "Final Steps".
    - q: Is my name on the certificate correct?
      a: Your name is registered with IOSH exactly as on your photo ID. Tell us straight away if anything needs changing.
    - q: Do the bonus certificates cost anything?
      a: No. They're included, and the exams are free. If any website asks for card details, stop and contact us.
    - q: Which bonus certificate should I start with?
      a: IBM SkillsBuild Project Management Fundamentals, then Six Sigma Yellow Belt, Scrum Fundamentals Certified and HP LIFE.
    - q: Does this make me Tech IOSH?
      a: It meets the academic requirement. IOSH also asks for at least one year's relevant experience and mandatory CPD when you apply.
    - q: Who do I contact for help?
      a: WhatsApp +974 7048 5638 or email safety.training@carbonblueglobal.com.
    - q: Do you guarantee a job?
      a: No. No honest course can. What we do is give you a stronger CV, a better LinkedIn profile, a steady list of openings and conversations with experienced people in the industry. The rest depends on your skills, effort and how you present yourself.
    - q: When does Career Launch Support start and end?
      a: It starts when you enrol and runs until one month after you receive your IOSH Level 3 certificate.
    - q: Does it cost extra?
      a: No. It is included in your course fee.

