included:
  heading: One course, five certificates and a toolkit
  intro: Your course fee covers everything below. Nothing more to pay for registration, assessments or materials.
  cards:
    - title: IOSH Level 3 Certificate.
      body: The regulated qualification employers recognise. Awarded by IOSH, regulated by Ofqual, and your academic route to Technical Member (Tech IOSH).
      featured: true
    - title: Four bonus certificates.
      body: IBM SkillsBuild Project Management Fundamentals, Six Sigma Yellow Belt, Scrum Fundamentals Certified and HP LIFE AI for Business Professionals. Studied online at your own pace, with a CBG guide for each.
    - title: Eight CBG Field Guides.
      body: Practical workbooks for daily HSE work, yours from day 1.
    - title: CBG study materials.
      body: A workbook for each unit with Check yourself questions, a Practice Pack of 24 OSH in Practice tasks with blank IOSH templates, an Exam Skills guide, a Key Words list and mock exams for both assessments. Your trainers present the slides live in class.
    - title: IOSH registration and both assessments.
      body: CBG registers you with IOSH as a learner, and both externally set assessments are covered.

units:
  heading: "Your learning path: 4 units, 16 sessions"
  intro: Each unit is taught in live sessions. Every unit starts with its workbook, and every session has its own class link and study notes on this page, in teaching order.
  units:
    - code: L3C01
      title: Fundamentals of OSH principles and management systems
      glh: 21
      outcomes:
        - Understand OSH principles, the elements of a safety management system and the role they play in OSH performance
        - Understand management systems in relation to OSH
        - Understand the specialist services needed to support good OSH practice
      sessions:
        - { id: "1.1", title: Fundamentals of OSH Principles }
        - { id: "1.2", title: OSH Management Systems }
        - { id: "1.3", title: Consultation and Communication }
    - code: L3C02
      title: Principles and application of OSH risk management
      glh: 27
      outcomes:
        - Understand the application of risk assessment and risk management
        - Be able to carry out and review risk assessments in the workplace
        - Understand the role and process of workplace inspection and audit
        - Be able to undertake a workplace inspection
      sessions:
        - { id: "2.1", title: OSH Risk Management }
        - { id: "2.2", title: Safe Systems of Work }
        - { id: "2.3", title: Inspection and Auditing }
        - { id: "2.4", title: Risk Assessment Workshop }
        - { id: "2.5", title: Workplace Inspection Workshop }
    - code: L3C03
      title: Principles and application of OSH incident management
      glh: 12
      outcomes:
        - Understand the definitions of incidents and their causation
        - Understand the process of the investigation of incidents
        - Be able to investigate incidents
      sessions:
        - { id: "3.1", title: Incident Management and Terminology }
        - { id: "3.2", title: Causation Theories of Accidents }
        - { id: "3.3", title: Incident Investigation }
        - { id: "3.4", title: Investigation Process and Report }
        - { id: "3.5", title: Incident Investigation Workshop }
    - code: L3C04
      title: Improving organisational OSH performance and culture
      glh: 20
      outcomes:
        - Understand the effective application of an organisation's safety management systems
        - Understand how your own professional conduct and capabilities influence OSH performance
        - Be able to deliver improvements to OSH controls through effective communication
      sessions:
        - { id: "4.1", title: Improving OSH Performance }
        - { id: "4.2", title: Continuous Improvement and Performance }
        - { id: "4.3", title: Toolbox Talk Workshop }

how-classes-run:
  heading: How your classes run
  items:
    - title: Live online classes on Google Meet.
      body: Each session's Meet link is on this page, just before that session's study notes.
    - title: About two months.
      body: >-
        All four units are covered in about two months: 36 hours of live online tuition, with guided self-study making up the rest of the 80 guided learning hours.
    - title: Independent study.
      body: On top of the 80 guided hours, IOSH expects about 42 hours of your own study (122 hours in total). Use it to read your workbook, answer the Check yourself questions, try the Practice Pack tasks and mock exams, and work on your bonus certificates.
    - title: Trainer support.
      body: Your trainers answer questions between classes and give revision guidance before each assessment.
    - title: What you need.
      body: A laptop or PC with a webcam and a stable internet connection.
  timetable:
    label: Timetable
    text: class days and times are confirmed for each batch and shared in the "How the Course Works" lesson and at the introduction session.

assessment:
  heading: How you're assessed
  intro: IOSH sets and marks two external assessments. Both are online and remotely invigilated, so you take them from home with a webcam. You must pass both. The result is Pass or Refer, and if you're referred in one, you only retake that one.
  assessments:
    - label: Assessment 1
      title: OSH Principles Examination
      points:
        - 2 hours, 80 multiple-choice questions, auto-marked
        - Pass mark 70%
        - Covers all four units
    - label: Assessment 2
      title: OSH in Practice Assessment
      points:
        - 2 hours, based on a realistic workplace scenario, marked by an IOSH examiner
        - Pass mark 50%
      tasksIntro: Four tasks, 25 marks each
      tasks:
        - { name: workplace inspection, marks: 25 }
        - { name: incident investigation, marks: 25 }
        - { name: risk assessment, marks: 25 }
        - { name: toolbox talk, marks: 25 }
      tasksNote: Each task has its own workshop session in the units
  techIoshNote: Passing the Level 3 Certificate meets the academic requirement for Technical Member of IOSH (Tech IOSH). To apply you also need at least one year's relevant experience and IOSH's mandatory CPD. A natural next step is the IOSH Level 6 Diploma.

