bonus:
  heading: Four extra certificates, at your own pace
  intro: Studied online on each issuer's website, alongside the IOSH course. You create your own account and take the issuer's assessment; the certificate comes from the issuer. Full setup steps and a CBG guide for each are in the "Bonus Certificates" section of this course.
  # The recommended order.
  steps:
    - title: "IBM SkillsBuild: Project Management Fundamentals."
      body: The project lifecycle, so your HSE plans are run like real projects. Earns an IBM digital badge (Credly).
    - title: Six Sigma Yellow Belt (6sigmastudy).
      body: >-
        DMAIC, a step-by-step way to find root causes and reduce incidents. Free online exam: 40 questions, 60 minutes, pass at 28/40.
    - title: Scrum Fundamentals Certified (SCRUMstudy).
      body: >-
        How modern project teams work in short sprints. Free online exam: 40 questions, 60 minutes, pass at 30/40.
    - title: "HP LIFE: AI for Business Professionals."
      body: Using AI tools safely and well for reports and documents. Certificate of completion.
  smallPrint: CBG is not affiliated with IBM, HP, 6sigmastudy or SCRUMstudy. Course names belong to their owners.

