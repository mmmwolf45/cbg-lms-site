# Structural Design course page copy (course 103, RCC). Edit the wording here; the site is built from this file.
# Rules: plain British English, no em-dashes, nothing invented. Section ids are stable.
# Run `npm run content:check` after editing.
#
# Sources (in priority order):
#   - the live course page /course/103-structural-design (Maasoom's own copy, 13 Oct 2026): the subtitle,
#     "This Course Includes", the overview, "What You Will Learn", the lesson list and the 10 FAQ answers
#   - Maasoom's Drive "Structural_LMS_Onboarding_Plan.md" (13 Oct 2026): 6 RCC modules, 31 sessions; steel
#     follows later; no ductile detailing, drawings, live project or career module
#   - the Entri course page, ONLY for faculty names, roles and photos and two learner reviews
#   - the card's languages: Maasoom's workbook "CBG - Course List for Web Development.xlsx"
#
# Left out on purpose (not shown to students):
#   - Steel design (Maasoom, 14 Oct 2026: RCC only on this page until the steel decks arrive; FAQ 6 says it
#     will be added), and with it the workbook's "12 months" chip and Tekla (both counted the steel part)
#   - Entri's 12-module syllabus, ratings, placement count, NSDC wording, live projects, ductile detailing and
#     "12 months of mentorship" (the onboarding plan drops these topics)
#   - an assessment section (the only assignment is the learner agreement in Start Here) and a timetable
#     (no batch days are published for this course)
#   - Najla Yas Valiyakath's review (it mentions Entri) and Sahana Hashim's (it promises a live project
#     certificate the course no longer has)
#
# Illustrative, for Maasoom to approve: the hero's load take-down numbers and the beam's load and span
# (examples, labelled so on the page).

