included:
  heading: One course, one real building, start to finish
  intro: Everything below is part of your course, from your first class to your job search.
  cards:
    - title: Live online classes.
      body: Taught live by CBG structural design engineers, with the slides for every session on this platform.
      featured: true
    - title: 6 RCC modules, 31 sessions.
      body: From loads to foundations, in the order you meet them on a real project.
    - title: Software on a real building.
      body: ETABS, STAAD.Pro and SAFE in a real G+5 building workflow, plus AutoCAD.
    - title: Three design codes.
      body: Design to IS codes, with BS 8110 and ACI 318 versions of the key topics, since Gulf projects use all three.
    - title: Worked examples.
      body: Step-by-step worked examples for every structural element.
    - title: CV and interview preparation.
      body: CV sessions, a line-by-line CV review, interview preparation and mock interviews. CBG has supported 500+ global placements.

units:
  heading: "Your learning path: 6 modules, 31 sessions"
  intro: After the Start Here orientation, the 6 modules follow the work on a real multi-storey building, from the framing plan and the loads to the model, the design of each element and the foundations.
  # The building drawing labels each floor "<n> sessions": six modules, six floors, like the G+5 building.
  hoursLabel: sessions
  hoursShort: sessions
  units:
    - code: M01
      title: Introduction to Structural Design
      glh: 2
      outcomes:
        - Explain the structural engineer's role and the design process from architectural drawings to GFC drawings
        - Prepare a framing plan and read a soil investigation report
      sessions:
        - { id: "1.1", title: Introduction to Structural Design }
        - { id: "1.2", title: Framing Plan and Soil Investigation }
    - code: M02
      title: Structural Analysis Software
      glh: 2
      outcomes:
        - Model, load and analyse a building in ETABS and STAAD.Pro
      sessions:
        - { id: "2.1", title: Introduction to ETABS }
        - { id: "2.2", title: Introduction to STAAD.Pro }
    - code: M03
      title: Loads on Structures
      glh: 6
      outcomes:
        - Calculate gravity, wind and seismic loads to IS 875 and IS 1893, with BS and ASCE 7 comparisons
        - Set up load combinations and cracked-section stiffness modifiers
      sessions:
        - { id: "3.1", title: Gravity Loads }
        - { id: "3.2", title: "Wind Loads Part 1: Concepts and IS 875-3" }
        - { id: "3.3", title: "Wind Loads Part 2: BS and ASCE 7" }
        - { id: "3.4", title: "Seismic Loads Part 1: Concepts and IS 1893" }
        - { id: "3.5", title: "Seismic Loads Part 2: Eurocode 8 and ASCE 7" }
        - { id: "3.6", title: Load Combinations and Stiffness Modifiers }
    - code: M04
      title: Modelling and Analysis in ETABS
      glh: 5
      outcomes:
        - Run model checks for drift, displacement and irregularities, and static and dynamic analysis
        - Verify software output with quick hand calculations
      sessions:
        - { id: "4.1", title: Modelling Definitions in ETABS }
        - { id: "4.2", title: Wind and Seismic Load Assignments }
        - { id: "4.3", title: Model Checks in ETABS }
        - { id: "4.4", title: Static and Dynamic Analysis }
        - { id: "4.5", title: Manual Verification of Software Output }
    - code: M05
      title: Design of RCC Superstructure
      glh: 9
      outcomes:
        - Design RCC beams to IS 456, BS 8110 and ACI 318
        - Design one-way, two-way and cantilever slabs
        - Design columns, staircases and shear walls, with code-compliant detailing
      sessions:
        - { id: "5.1", title: RCC Beam Design to IS 456 }
        - { id: "5.2", title: RCC Beam Design to BS 8110 }
        - { id: "5.3", title: RCC Beam Design to ACI 318 }
        - { id: "5.4", title: RCC Slab Design to IS 456 }
        - { id: "5.5", title: RCC Slab Design to BS 8110 }
        - { id: "5.6", title: Cantilever Slab Design }
        - { id: "5.7", title: RCC Column Design }
        - { id: "5.8", title: Staircase Design }
        - { id: "5.9", title: Shear Wall Design }
    - code: M06
      title: Foundations and Special Structures
      glh: 7
      outcomes:
        - Design isolated and combined footings, piles and pile caps
        - Design cantilever retaining walls and rectangular water tanks
      sessions:
        - { id: "6.1", title: Isolated Footing Design }
        - { id: "6.2", title: Combined Footing Design }
        - { id: "6.3", title: Pile Foundations }
        - { id: "6.4", title: RCC Pile Design }
        - { id: "6.5", title: Pile Cap Design }
        - { id: "6.6", title: Retaining Wall Design }
        - { id: "6.7", title: Water Tank Design }

# Bending moment beam (Module 5): one beam, three ways to support it. The load slides along the span and the
# bending moment and shear diagrams redraw; the steel sits on the tension face. ILLUSTRATIVE numbers (a
# 100 kN point load on a 6 m span), for Maasoom to approve.
beam:
  heading: Move the load. Watch the beam answer.
  intro: Every beam you design in Module 5 starts here. Where the load sits sets the bending moment and the shear, and the bending moment decides where the steel goes. Slide the load and change the supports to see it.
  load: 100
  span: 6
  caption: "Example: a 100 kN point load on a 6 m beam. Bending moment is drawn on the tension side; the gold bars show where the main steel goes."

# Below the ground (Module 6): the X-ray band shows the foundations under the building. `at` is each label's
# point [x, y] in source pixels of the photos as built (1536 x 1020) (14 Oct 2026); `side` keeps each chip on the photo.
xray:
  heading: Below the ground, where every load ends up
  intro: Every load you calculate in Module 3 finishes its journey in the soil. In Module 6 you design what carries it there, from isolated and combined footings to piles and pile caps, and the retaining walls that hold the ground back, reading the soil report you met in Module 1.
  image: sd-ground-surface
  xray: sd-ground-section
  imageAlt: A concrete building on its plot; where the scan passes, the ground is cut away to show its footings, piles, pile cap and retaining wall in the soil
  scanLabel: "Ground scan: move to see the foundations"
  labels:
    - { text: Isolated footing, at: [174, 371], side: right }
    - { text: Combined footing, at: [558, 377], side: right }
    - { text: Pile cap, at: [929, 379], side: right }
    - { text: Piles, at: [929, 665], side: right }
    - { text: Retaining wall, at: [1331, 461], side: left }
  caption: "Module 6: Foundations and Special Structures."

