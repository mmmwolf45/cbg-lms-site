faq:
  heading: Student FAQ
  items:
    - q: Who is this course for?
      a: Civil engineering graduates, freshers and working professionals who want a career in structural design, in a consultancy, with a contractor or as an in-house structural engineer.
    - q: What background do I need?
      a: A degree or diploma in civil engineering, with the basics of strength of materials and structural analysis. You do not need prior experience with ETABS or STAAD.Pro.
    - q: Which software will I use?
      a: ETABS, STAAD.Pro, SAFE and AutoCAD. Install them before the software module starts.
    - q: Which design codes are covered?
      a: Mainly the Indian Standards (IS 456, IS 875, IS 1893, IS 13920, IS 2911, IS 3370), with British Standard and American (ACI 318, ASCE 7) versions of the key topics, since Gulf projects use all three.
    - q: How are classes delivered?
      a: Through live online classes with CBG structural engineers. The slides for every session are on this platform.
    - q: Does the course cover steel design?
      a: Steel design modules will be added to this course.
    - q: Will I get a certificate?
      a: Yes. You can earn a CBG Course Completion Certificate when you meet the attendance, assignment and course progress requirements.
    - q: Do you help with jobs?
      a: CBG runs CV sessions, a line-by-line CV review, interview preparation and mock interviews, and has supported 500+ global placements.
    - q: How do I enrol?
      a: Enrolment is by invitation. Use the Contact To Enroll button to message CBG on WhatsApp, and the team will guide you through enrolment and payment.
    - q: Who do I contact with questions during the course?
      a: Your batch WhatsApp group is the official channel for announcements and questions.

