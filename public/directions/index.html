<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CBG visual directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* T7 sample page. Not part of the site build: three directions on the same real copy.
   Each direction is a token set on [data-dir]; components read only the tokens. */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: #05070c; color: #e9edf5; font: 400 16px/1.5 "Source Sans 3", system-ui, sans-serif; }

[data-dir="a"] {
  --bg: #0B1426; --surface: #101C34; --line: #22345A; --text1: #EEF2F9; --text2: #B4C0D8; --text3: #8996B1;
  --gold: #C9A24B; --btn: #C9A24B; --btn-text: #0B1426;
  --radius: 2px; --radius-btn: 2px; --radius-chip: 2px;
  --canvas: linear-gradient(rgba(201,214,240,.045) 1px, transparent 1px) 0 0 / 32px 32px,
            linear-gradient(90deg, rgba(201,214,240,.045) 1px, transparent 1px) 0 0 / 32px 32px,
            linear-gradient(rgba(201,214,240,.06) 1px, transparent 1px) 0 0 / 160px 160px,
            linear-gradient(90deg, rgba(201,214,240,.06) 1px, transparent 1px) 0 0 / 160px 160px, #0B1426;
  --frame-line: #C9D6F0; --frame-accent: #C9A24B; --sky: transparent;
}
[data-dir="b"] {
  --bg: #07090F; --surface: #11141C; --line: rgba(255,255,255,.09); --text1: #F3F5F9; --text2: #C0C6D2; --text3: #8F96A5;
  --gold: #D6B160; --btn: #F3F5F9; --btn-text: #07090F;
  --radius: 18px; --radius-btn: 999px; --radius-chip: 999px;
  --canvas: radial-gradient(60% 50% at 85% 0%, rgba(32,55,105,.45), transparent 70%), #07090F;
  --frame-line: rgba(243,245,249,.75); --frame-accent: #D6B160;
  --sky: linear-gradient(180deg, #0A1124 0%, #142347 62%, #3a3524 100%);
}
[data-dir="c"] {
  --bg: #0F1A35; --surface: #17284F; --line: #2A3F6E; --text1: #F6F8FC; --text2: #C9D6F0; --text3: #9DAACA;
  --gold: #E0B04C; --btn: #E0B04C; --btn-text: #0F1A35;
  --radius: 14px; --radius-btn: 999px; --radius-chip: 999px;
  --canvas: linear-gradient(180deg, #13214A 0%, #0F1A35 40%, #0B142B 100%);
  --frame-line: #E0B04C; --frame-accent: #F6F8FC;
  --sky: linear-gradient(160deg, #1B2F5C 0%, #0F1A35 70%);
}

/* Sample chrome (not part of any direction) */
.meta { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline;
  padding: 12px 16px; background: #fff; color: #111; font: 600 14px/1.4 system-ui, sans-serif; border-bottom: 1px solid #ddd; }
.meta b { font-size: 16px; }
.meta span { font-weight: 400; color: #444; max-width: 70ch; }
.meta .sw { display: inline-flex; gap: 4px; }
.meta .sw i { width: 18px; height: 18px; border-radius: 4px; border: 1px solid #0002; }
.jump { display: flex; gap: 12px; padding: 12px 16px; background: #fff; font: 600 14px system-ui; }
.jump a { color: #203769; }

/* Direction surface */
.dir { background: var(--canvas); color: var(--text2); padding-bottom: 96px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 768px) { .wrap { padding: 0 40px; } }
.col { max-width: 792px; }
h1, h2, h3 { font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--text1); margin: 0; }

/* Hero */
.hero { display: grid; gap: 32px; padding: 40px 0 72px; align-items: center; }
@media (min-width: 1024px) { .hero { grid-template-columns: 1.1fr 1fr; gap: 48px; padding: 72px 0 96px; } }
.chip { display: inline-block; padding: 6px 12px; border: 1px solid var(--line); border-radius: var(--radius-chip);
  font-size: 14px; font-weight: 600; color: var(--text2); letter-spacing: .01em; }
.h1 { font-size: clamp(40px, 5vw, 64px); font-weight: 800; line-height: 1.02; letter-spacing: -.035em; margin: 20px 0 20px; }
.h1 .dim { display: block; color: var(--text3); }
.h1 .gold { color: var(--gold); }
.lead { font-size: 20px; line-height: 1.5; color: var(--text2); max-width: 32ch; margin: 0 0 32px; }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 24px; border-radius: var(--radius-btn);
  font: 700 16px "Plus Jakarta Sans", sans-serif; text-decoration: none; cursor: pointer; border: 1px solid transparent;
  transition: transform .2s cubic-bezier(.22,1,.36,1), background-color .2s; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .faq summary:focus-visible, .card a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.btn--primary { background: var(--btn); color: var(--btn-text); }
.btn--ghost { border-color: var(--line); color: var(--text1); }
.btn svg { width: 18px; height: 18px; }

.visual { position: relative; aspect-ratio: 4 / 3.4; border-radius: var(--radius); overflow: hidden; background: var(--sky); }
[data-dir="a"] .visual { border: 1px solid var(--line); background: rgba(11,20,38,.6); }
[data-dir="a"] .visual::before, [data-dir="a"] .visual::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--gold); }
[data-dir="a"] .visual::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
[data-dir="a"] .visual::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
[data-dir="b"] .visual { border-radius: 24px; }
.visual svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.visual .l { fill: none; stroke: var(--frame-line); stroke-width: 1.1; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.visual .l--faint { opacity: .28; }
.visual .l--accent { stroke: var(--frame-accent); stroke-width: 1.6; }
.visual .slab { fill: var(--gold); opacity: .16; }
@media (prefers-reduced-motion: no-preference) {
  .visual .l { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s cubic-bezier(.22,1,.36,1) forwards; animation-delay: calc(var(--i) * 70ms); }
  .visual .slab { opacity: 0; animation: glow 1.2s ease forwards 1.4s; }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes glow { to { opacity: .16; } }

/* Section header */
.sec { padding: 72px 0 0; }
.sec-head { margin-bottom: 32px; }
.h2 { text-wrap: balance; font-size: clamp(28px, 3.4vw, 40px); font-weight: 800; letter-spacing: -.025em; line-height: 1.1; }
.h2 .dim { color: var(--text3); }
.num { display: none; font: 800 40px/1 "Plus Jakarta Sans", sans-serif; color: var(--gold); margin-right: 16px; }
[data-dir="c"] .num { display: inline-block; vertical-align: -4px; }
.rule { display: none; width: 48px; height: 2px; background: var(--gold); margin-bottom: 16px; }
[data-dir="a"] .rule { display: block; }

/* Steps (gold thread) */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 32px; position: relative; }
@media (min-width: 1024px) { .steps { grid-template-columns: repeat(3, 1fr); gap: 40px; } }
.step { position: relative; padding-left: 56px; }
@media (min-width: 1024px) { .step { padding-left: 0; padding-top: 64px; } }
.node { position: absolute; left: 0; top: 0; width: 40px; height: 40px; display: grid; place-items: center;
  border: 1px solid var(--gold); border-radius: 50%; font: 700 15px "Plus Jakarta Sans", sans-serif; color: var(--gold); background: var(--bg); z-index: 1; }
[data-dir="a"] .node { border-radius: 2px; }
[data-dir="b"] .node { border: 0; width: auto; height: auto; font-size: 48px; font-weight: 800; color: var(--text3); background: none; top: -6px; }
[data-dir="c"] .node { background: var(--gold); color: var(--btn-text); border: 0; }
.steps::before { content: ""; position: absolute; left: 19px; top: 20px; bottom: 20px; width: 1px; background: linear-gradient(var(--gold), transparent); }
@media (min-width: 1024px) { .steps::before { left: 20px; right: 20px; top: 20px; bottom: auto; width: auto; height: 1px; background: linear-gradient(90deg, var(--gold), rgba(0,0,0,0)); } }
[data-dir="b"] .steps::before { display: none; }
.step h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.step p { margin: 0; max-width: 40ch; }
[data-dir="c"] .step { background: var(--surface); border-radius: var(--radius); padding: 24px 24px 24px 80px; }
[data-dir="c"] .step .node { left: 24px; top: 24px; }
@media (min-width: 1024px) { [data-dir="c"] .step { padding: 88px 24px 24px; } }
[data-dir="c"] .steps::before { display: none; }

/* Cards */
.card { position: relative; border-radius: var(--radius); padding: 28px; border: 1px solid var(--line); }
[data-dir="b"] .card { background: rgba(255,255,255,.035); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
[data-dir="c"] .card { background: var(--surface); border-color: transparent; }
.card--feat { border-color: var(--gold); }
[data-dir="b"] .card--feat { border-color: rgba(214,177,96,.55); }
.course { display: grid; gap: 16px; max-width: 640px; }
.course h3 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.course p { margin: 0; }
.tag { font-size: 14px; font-weight: 600; color: var(--gold); }
.facts-row { display: flex; flex-wrap: wrap; gap: 8px; }
.facts-row .chip { font-weight: 600; color: var(--text2); }
.course a.btn { justify-self: start; }

/* Course page slice (inside the 792px column) */
.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
@media (min-width: 640px) { .facts { grid-template-columns: repeat(3, 1fr); } }
.fact { background: var(--bg); padding: 20px; }
[data-dir="c"] .fact { background: var(--surface); }
.fact b { display: block; font: 800 32px/1.1 "Plus Jakarta Sans", sans-serif; color: var(--text1); letter-spacing: -.02em; }
.fact span { font-size: 15px; color: var(--text3); }
.fact--wide b { font-size: 18px; padding-top: 10px; }
.included { display: grid; gap: 16px; }
@media (min-width: 640px) { .included { grid-template-columns: 1.2fr 1fr; } }
.included h3 { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
.included p { margin: 0; }
.faq { border-top: 1px solid var(--line); }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; display: flex; justify-content: space-between; gap: 16px; padding: 20px 0; cursor: pointer;
  font: 700 18px/1.35 "Plus Jakarta Sans", sans-serif; color: var(--text1); }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; color: var(--gold); font-size: 24px; line-height: 1; transition: transform .2s; }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq p { margin: 0 0 20px; max-width: 60ch; }
.sub { font: 700 13px "Plus Jakarta Sans", sans-serif; color: var(--text3); margin: 56px 0 16px; letter-spacing: .02em; }
</style>
</head>
<body>

<nav class="jump" aria-label="Directions"><a href="?d=a">A. Blueprint</a><a href="?d=b">B. Night editorial</a><a href="?d=c">C. Brochure dusk</a><a href="?">All three</a></nav>

<template id="tpl">
  <div class="wrap">
    <section class="hero" aria-label="Home hero">
      <div>
        <span class="chip">CBG Training Institute · IOSH Approved Study Centre 1003</span>
        <h1 class="h1">Welcome to your <span class="dim"><span class="gold">CBG</span> classroom</span></h1>
        <p class="lead">Your courses, live class links and study materials, all in one place.</p>
        <div class="ctas">
          <a class="btn btn--primary" href="#">Log in
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a class="btn btn--ghost" href="https://wa.me/97470485638">Need help?</a>
        </div>
      </div>
      <div class="visual" aria-hidden="true"><svg viewBox="160 30 560 530" preserveAspectRatio="xMidYMid meet"></svg></div>
    </section>

    <section class="sec" aria-labelledby="hiw">
      <div class="sec-head"><span class="rule"></span><h2 class="h2" id="hiw"><span class="num">01</span>How this site works</h2></div>
      <ol class="steps">
        <li class="step"><span class="node">1</span><h3>We set up your access.</h3><p>Once your enrolment is confirmed, CBG gives you access to your course. Your login details are shared about one week before your batch starts.</p></li>
        <li class="step"><span class="node">2</span><h3>Log in and open your course.</h3><p>Everything for your course sits on its course page: welcome guide, class links, slides, bonus certificate guides and more.</p></li>
        <li class="step"><span class="node">3</span><h3>Join your live classes and keep going.</h3><p>Classes run live on Google Meet. After each class, the slides and new study materials are waiting for you here.</p></li>
      </ol>
    </section>

    <section class="sec" aria-labelledby="yc">
      <div class="sec-head"><span class="rule"></span><h2 class="h2" id="yc"><span class="num">02</span>Your courses</h2></div>
      <article class="card course">
        <span class="tag">IOSH · Ofqual-regulated · Level 3</span>
        <h3>IOSH Level 3 Certificate</h3>
        <p>The IOSH Level 3 Certificate in Occupational Safety and Health Principles and Practice, taught live online by CBG trainers.</p>
        <div class="facts-row"><span class="chip">Live online</span><span class="chip">About 2 months</span><span class="chip">4 bonus certificates</span><span class="chip">8 Field Guides</span></div>
        <a class="btn btn--primary" href="#">Open course</a>
      </article>
    </section>

    <p class="sub">Course page, inside the 792px column</p>
    <div class="col">
      <div class="facts">
        <div class="fact"><b>Level 3</b><span>(RQF)</span></div>
        <div class="fact"><b>80</b><span>guided learning hours</span></div>
        <div class="fact"><b>About 2</b><span>months</span></div>
        <div class="fact"><b>4</b><span>units</span></div>
        <div class="fact"><b>2</b><span>IOSH assessments</span></div>
        <div class="fact fact--wide"><b>Ofqual no. 610/3188/4</b></div>
      </div>

      <section class="sec" aria-labelledby="inc">
        <div class="sec-head"><span class="rule"></span><h2 class="h2" id="inc"><span class="num">03</span>One course, five certificates <span class="dim">and a toolkit</span></h2></div>
        <div class="included">
          <div class="card card--feat"><h3>IOSH Level 3 Certificate.</h3><p>The regulated qualification employers recognise. Awarded by IOSH, regulated by Ofqual, and your academic route to Technical Member (Tech IOSH).</p></div>
          <div class="card"><h3>Eight CBG Field Guides.</h3><p>Practical workbooks for daily HSE work, yours from day 1.</p></div>
        </div>
      </section>

      <section class="sec" aria-labelledby="fq">
        <div class="sec-head"><span class="rule"></span><h2 class="h2" id="fq"><span class="num">04</span>Student FAQ</h2></div>
        <div class="faq">
          <details open><summary>Where do I find the link for my live class?</summary><p>In the unit sections of this course, each session has a "Live Class" lesson with the Google Meet link, just before that session's slides.</p></details>
          <details><summary>What do I need for the classes?</summary><p>A laptop or PC with a webcam and a stable internet connection. Join a few minutes early.</p></details>
        </div>
      </section>
    </div>
  </div>
</template>

<script>
const DIRS = {
  a: ['A. Blueprint', 'Engineering drawing. Blueprint grid, hairlines, sharp corners, outlined frames with gold corner marks. The most "technical team" of the three.', ['#0B1426', '#101C34', '#B4C0D8', '#C9A24B']],
  b: ['B. Night editorial', 'Closest to The Generalist. Near-black, huge two-tone type, glass cards, pill buttons. Gold only as a rare highlight. The calmest and most premium.', ['#07090F', '#11141C', '#C0C6D2', '#D6B160']],
  c: ['C. Brochure dusk', 'Closest to your brochure. Rich brand navy, filled cards, gold pill buttons and numbered sections ("01"). The most colour and the most familiar.', ['#0F1A35', '#17284F', '#C9D6F0', '#E0B04C']],
};

// Stand-in for "Blueprint to built": the real lines get traced over your hero photo.
function frame(svg) {
  const ex = [46, 15], ez = [-40, 13], fh = 40, o = [360, 430], X = 4, Z = 3, Y = 7;
  const p = (x, y, z) => [o[0] + x * ex[0] + z * ez[0], o[1] + x * ex[1] + z * ez[1] - y * fh];
  let i = 0, out = '';
  const line = (a, b, cls = '', d = 0) => {
    out += `<line class="l ${cls}" pathLength="1" style="--i:${d}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
  };
  const poly = (pts, cls) => (out += `<polygon class="${cls}" points="${pts.map((q) => q.join(',')).join(' ')}"/>`);
  for (const y of [1, 2]) {
    poly([p(0, y, Z), p(X, y, Z), p(X, y - 1, Z), p(0, y - 1, Z)], 'slab');
    poly([p(X, y, 0), p(X, y, Z), p(X, y - 1, Z), p(X, y - 1, 0)], 'slab');
  }
  for (let x = 0; x <= X; x++) line(p(x, 0, Z), p(x, Y, Z), '', x);
  for (let z = 0; z < Z; z++) line(p(X, 0, z), p(X, Y, z), '', X + Z - z);
  for (let x = 0; x < X; x++) line(p(x, 0, 0), p(x, Y, 0), 'l--faint', 8 + x);
  for (let z = 1; z < Z; z++) line(p(0, 0, z), p(0, Y, z), 'l--faint', 8);
  for (let y = 0; y <= Y; y++) {
    line(p(0, y, Z), p(X, y, Z), y === 0 ? 'l--accent' : '', 4 + y);
    line(p(X, y, Z), p(X, y, 0), y === 0 ? 'l--accent' : '', 4 + y);
    line(p(0, y, 0), p(X, y, 0), 'l--faint', 6 + y);
    line(p(0, y, 0), p(0, y, Z), 'l--faint', 6 + y);
  }
  for (let x = 1; x < X; x++) line(p(x, Y, 0), p(x, Y, Z), 'l--faint', 12);
  for (let z = 1; z < Z; z++) line(p(0, Y, z), p(X, Y, z), 'l--faint', 12);
  for (const [x, y] of [[0, 3], [1, 4], [3, 5], [2, 6]]) line(p(x, y, Z), p(x + 1, y + 1, Z), 'l--accent', 9 + y);
  for (const [z, y] of [[0, 4], [2, 5]]) line(p(X, y, z), p(X, y + 1, z + 1), 'l--accent', 9 + y);
  const m = p(5.6, 0, 0.3), top = m[1] - 420;
  line(m, [m[0], top], '', 6); line([m[0] + 10, m[1]], [m[0] + 10, top], '', 6);
  for (let k = 0; k < 10; k++) line([m[0], m[1] - k * 42], [m[0] + 10, m[1] - (k + 1) * 42], 'l--faint', 7 + k * 0.4);
  line([m[0] - 360, top + 8], [m[0] + 70, top + 8], '', 14); line([m[0] - 360, top + 8], [m[0] + 5, top - 40], 'l--faint', 15);
  line([m[0] + 5, top - 40], [m[0] + 70, top + 8], 'l--faint', 15); line([m[0] - 200, top + 8], [m[0] - 200, top + 150], 'l--accent', 16);
  svg.innerHTML = out;
}

const only = new URLSearchParams(location.search).get('d');
const tpl = document.getElementById('tpl');
for (const [key, [name, note, sw]] of Object.entries(DIRS)) {
  if (only && only !== key) continue;
  const meta = document.createElement('header');
  meta.className = 'meta';
  meta.innerHTML = `<b>${name}</b><span>${note}</span><span class="sw">${sw.map((c) => `<i style="background:${c}" title="${c}"></i>`).join('')}</span>`;
  const dir = document.createElement('main');
  dir.className = 'dir';
  dir.dataset.dir = key;
  dir.id = key;
  dir.append(tpl.content.cloneNode(true));
  frame(dir.querySelector('.visual svg'));
  document.body.append(meta, dir);
}
</script>
</body>
