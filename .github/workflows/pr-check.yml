name: PR check

# Runs the same tests and build (with the size gate) as the deploy, but on pull requests,
# so a change is checked before it is merged into main (which deploys the live site).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
