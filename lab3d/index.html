<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBG 3D playground</title>
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(120% 90% at 30% 10%, #14254a, #081226 50%, #040a17); color: #f3f5f9; font: 14px system-ui, sans-serif; }
  #host { position: fixed; inset: 0; }
  #host canvas { width: 100%; height: 100%; display: block; }
  #ui { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 12px; background: rgba(8,18,38,.85); border: 1px solid rgba(255,255,255,.12); z-index: 2; }
  #ui input[type=range] { width: 320px; }
  #ui select, #ui button { font: inherit; }
  #info { font-variant-numeric: tabular-nums; min-width: 40px; }
</style>
</head>
<body>
<div id="host"></div>
<div id="ui">
  <select id="scene"></select>
  <select id="quality"><option>high</option><option>mid</option><option>low</option></select>
  <input id="p" type="range" min="0" max="1" step="0.001" value="0">
  <span id="info">0.00</span>
  <button id="play" type="button">Play</button>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
